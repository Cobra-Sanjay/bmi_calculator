name: bmi_calculator
description: "Simple dart based bmi calculator app"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  animated_splash_screen: ^1.3.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_native_splash: ^2.2.10
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bmi.png

flutter_native_splash:
  color: "#000000"
  image: assets/splash_logo.png
  background_image: assets/splash_bg.png
  android: true
  ios: true
